<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Fuad Ahamed — builder of digital twins, AI products and hackathon wins">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.55" stop-color="#0b0f24"/>
      <stop offset="1" stop-color="#140a26"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2.2"/></filter>
    <clipPath id="clip"><rect width="1200" height="380" rx="22"/></clipPath>
    <style>
      .pulse{animation:pulse 3.2s ease-in-out infinite}
      .p2{animation-delay:1.1s}.p3{animation-delay:2.1s}
      @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
      .scan{animation:scan 6s linear infinite}
      @keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(420px)}}
      .float{animation:float 7s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      .caret{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <ellipse cx="930" cy="120" rx="320" ry="220" fill="url(#glow)"/>
    <ellipse cx="180" cy="330" rx="300" ry="160" fill="url(#glow2)"/>

    <!-- stars -->
    <g fill="#e0e7ff">
      <circle cx="80" cy="40" r="1.1" class="pulse"/><circle cx="240" cy="90" r="0.9" class="pulse p2"/>
      <circle cx="410" cy="30" r="1.2" class="pulse p3"/><circle cx="560" cy="70" r="0.8" class="pulse"/>
      <circle cx="700" cy="24" r="1" class="pulse p2"/><circle cx="1110" cy="52" r="1.2" class="pulse p3"/>
      <circle cx="1160" cy="150" r="0.9" class="pulse"/><circle cx="640" cy="140" r="0.7" class="pulse p3"/>
      <circle cx="30" cy="170" r="0.9" class="pulse p2"/><circle cx="350" cy="150" r="0.8" class="pulse"/>
    </g>

    <!-- perspective grid (digital-twin floor) -->
    <g stroke="url(#grid)" stroke-width="1" fill="none">
      <path d="M0 250H1200M0 268H1200M0 290H1200M0 318H1200M0 352H1200"/>
      <path d="M600 230L-300 380M600 230L-60 380M600 230L180 380M600 230L400 380M600 230L600 380M600 230L800 380M600 230L1020 380M600 230L1260 380M600 230L1500 380"/>
    </g>
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#22d3ee" opacity="0.18"/>

    <!-- wireframe city / network nodes on the right -->
    <g class="float" transform="translate(0,0)">
      <g stroke="#a78bfa" stroke-opacity="0.75" fill="none" stroke-width="1.2">
        <path d="M900 236 l40 -22 l40 22 l-40 22z M900 236 v-80 l40 -22 v80 M980 236 v-80 l-40 -22"/>
        <path d="M900 156 l40 22 l40 -22"/>
        <path d="M1010 246 l28 -15 l28 15 l-28 15z M1010 246 v-120 l28 -15 v120 M1066 246 v-120 l-28 -15"/>
        <path d="M1010 126 l28 15 l28 -15"/>
        <path d="M840 252 l22 -12 l22 12 l-22 12z M840 252 v-50 l22 -12 v50 M884 252 v-50 l-22 -12"/>
        <path d="M840 202 l22 12 l22 -12"/>
      </g>
      <g stroke="#22d3ee" stroke-width="1.4" stroke-dasharray="4 6" fill="none" opacity="0.9">
        <path d="M862 190 Q 940 90 1038 112">
          <animate attributeName="stroke-dashoffset" values="0;-40" dur="1.6s" repeatCount="indefinite"/>
        </path>
        <path d="M940 134 Q 1000 60 1100 80">
          <animate attributeName="stroke-dashoffset" values="0;-40" dur="2.2s" repeatCount="indefinite"/>
        </path>
      </g>
      <g fill="#22d3ee">
        <circle cx="862" cy="190" r="4" class="pulse"/><circle cx="1038" cy="112" r="4" class="pulse p2"/>
        <circle cx="940" cy="134" r="4" class="pulse p3"/><circle cx="1100" cy="80" r="4" class="pulse"/>
      </g>
      <!-- drone -->
      <g transform="translate(1110 180)">
        <animateTransform attributeName="transform" type="translate" values="1110 180;1060 150;1110 180" dur="6s" repeatCount="indefinite"/>
        <rect x="-10" y="-3" width="20" height="6" rx="3" fill="#f472b6"/>
        <path d="M-18 -6h12M6 -6h12" stroke="#f9a8d4" stroke-width="2"/>
        <circle r="10" fill="none" stroke="#f472b6" stroke-opacity="0.5">
          <animate attributeName="r" values="8;22;8" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="64" y="86" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16" fill="#67e8f9" letter-spacing="3">~/fuad $ whoami<tspan class="caret" fill="#67e8f9">▍</tspan></text>
      <text x="60" y="160" font-size="74" font-weight="800" fill="url(#name)" letter-spacing="-1">Fuad Ahamed</text>
      <text x="62" y="160" font-size="74" font-weight="800" fill="url(#name)" letter-spacing="-1" opacity="0.35" filter="url(#blur)">Fuad Ahamed</text>
      <text x="64" y="204" font-size="24" font-weight="600" fill="#e2e8f0">Full-stack &amp; AI builder · digital twins · security</text>
      <text x="64" y="236" font-size="17" fill="#94a3b8">I turn hard problems into working demos — and working demos into wins.</text>
    </g>

    <!-- trophy chips -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700">
      <g transform="translate(64 276)">
        <rect width="270" height="36" rx="18" fill="#facc15" fill-opacity="0.12" stroke="#facc15" stroke-opacity="0.7"/>
        <text x="18" y="23" fill="#fde68a">🏆 1st · AI Everything Hackathon</text>
      </g>
      <g transform="translate(348 276)">
        <rect width="250" height="36" rx="18" fill="#facc15" fill-opacity="0.12" stroke="#facc15" stroke-opacity="0.7"/>
        <text x="18" y="23" fill="#fde68a">🏆 1st · Oriane × Replit</text>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="379" rx="22" fill="none" stroke="#a78bfa" stroke-opacity="0.35"/>
  </g>
</svg>
