<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Thanks for stopping by">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <path fill="url(#w)" opacity="0.35">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0 70 Q300 30 600 70 T1200 70 V120 H0Z;M0 70 Q300 110 600 70 T1200 70 V120 H0Z;M0 70 Q300 30 600 70 T1200 70 V120 H0Z"/>
  </path>
  <path fill="url(#w)" opacity="0.6">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0 90 Q300 120 600 90 T1200 90 V120 H0Z;M0 90 Q300 60 600 90 T1200 90 V120 H0Z;M0 90 Q300 120 600 90 T1200 90 V120 H0Z"/>
  </path>
  <text x="600" y="40" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#a78bfa">thanks for stopping by — let's build the next winner ✦</text>
</svg>
