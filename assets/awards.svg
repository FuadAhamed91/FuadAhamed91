<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Two first-place wins: AI Everything Hackathon (UnderGrid) and Oriane × Replit Build for the Video Economy Hackathon (PRE//FLIGHT, 1st of 48 teams)">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#1a1033"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#facc15"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#facc15"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sweep{animation:sweep 5s ease-in-out infinite}
      .s2{animation-delay:2.5s}
      @keyframes sweep{0%{transform:translateX(-300px)}60%,100%{transform:translateX(700px)}}
      .bob{animation:bob 4s ease-in-out infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
    <clipPath id="c1"><rect x="10" y="10" width="580" height="280" rx="20"/></clipPath>
    <clipPath id="c2"><rect x="610" y="10" width="580" height="280" rx="20"/></clipPath>
    <g id="trophy">
      <path d="M-26 -34h52v18c0 18-12 32-26 32s-26-14-26-32z" fill="url(#gold)"/>
      <path d="M-26 -28h-12c0 14 8 22 16 24M26 -28h12c0 14-8 22-16 24" fill="none" stroke="url(#gold)" stroke-width="5"/>
      <rect x="-6" y="16" width="12" height="12" fill="url(#gold)"/>
      <rect x="-20" y="28" width="40" height="9" rx="3" fill="url(#gold)"/>
      <text y="-6" text-anchor="middle" font-size="20" font-weight="900" fill="#78350f" font-family="'Segoe UI', Arial, sans-serif">1</text>
    </g>
  </defs>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <!-- Card 1 -->
    <rect x="10" y="10" width="580" height="280" rx="20" fill="url(#card)"/>
    <g clip-path="url(#c1)"><rect class="sweep" x="0" y="0" width="220" height="300" fill="url(#shine)"/></g>
    <rect x="10" y="10" width="580" height="280" rx="20" fill="none" stroke="url(#edge)" stroke-width="2"/>
    <g class="bob" transform="translate(0 0)"><use href="#trophy" x="80" y="92"/></g>
    <text x="140" y="66" font-size="13" font-weight="700" fill="#facc15" letter-spacing="3">1ST PLACE</text>
    <text x="140" y="98" font-size="28" font-weight="800" fill="#f8fafc">AI Everything Hackathon</text>
    <text x="140" y="126" font-size="16" fill="#94a3b8">Team build with Bilal · Umar · Awaiz</text>
    <line x1="40" y1="160" x2="560" y2="160" stroke="#334155"/>
    <text x="40" y="196" font-size="24" font-weight="800" fill="#67e8f9">UnderGrid</text>
    <text x="40" y="226" font-size="16" fill="#cbd5e1">A 3D digital twin of a city's underground pipes &amp; cables —</text>
    <text x="40" y="250" font-size="16" fill="#cbd5e1">detects, predicts and plans the repair before the street breaks.</text>
    <text x="40" y="274" font-size="13" fill="#a78bfa" font-family="Consolas, monospace">DETECT → PREDICT → PRIORITIZE → PLAN</text>

    <!-- Card 2 -->
    <rect x="610" y="10" width="580" height="280" rx="20" fill="url(#card)"/>
    <g clip-path="url(#c2)"><rect class="sweep s2" x="600" y="0" width="220" height="300" fill="url(#shine)"/></g>
    <rect x="610" y="10" width="580" height="280" rx="20" fill="none" stroke="url(#edge)" stroke-width="2"/>
    <g class="bob" style="animation-delay:2s"><use href="#trophy" x="680" y="92"/></g>
    <text x="740" y="66" font-size="13" font-weight="700" fill="#facc15" letter-spacing="3">1ST PLACE · OF 48 TEAMS</text>
    <text x="740" y="98" font-size="28" font-weight="800" fill="#f8fafc">Oriane × Replit</text>
    <text x="740" y="126" font-size="16" fill="#94a3b8">Build for the Video Economy · Dubai</text>
    <line x1="640" y1="160" x2="1160" y2="160" stroke="#334155"/>
    <text x="640" y="196" font-size="24" font-weight="800" fill="#f472b6">PRE//FLIGHT</text>
    <text x="640" y="226" font-size="16" fill="#cbd5e1">Tells brands if their campaign idea has already been done —</text>
    <text x="640" y="250" font-size="16" fill="#cbd5e1">before they spend money shooting it.</text>
    <text x="640" y="274" font-size="13" fill="#a78bfa" font-family="Consolas, monospace">brief → real IG/TikTok search → saturation → white space</text>
  </g>
</svg>
